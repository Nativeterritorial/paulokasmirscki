<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ecossistema PK">
  <!-- ícone do site na busca do Google: o Google recorta em círculo, então o
       degradê vai até a borda e o símbolo branco fica grande, no centro -->
  <defs>
    <linearGradient id="pkfav" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#pkfav)"/>
  <g stroke="#fff" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="60" x2="96" y2="60"/>
    <line x1="60" y1="60" x2="78" y2="91.2"/>
    <line x1="60" y1="60" x2="42" y2="91.2"/>
    <line x1="60" y1="60" x2="24" y2="60"/>
    <line x1="60" y1="60" x2="42" y2="28.8"/>
    <line x1="60" y1="60" x2="78" y2="28.8"/>
  </g>
  <g fill="#fff">
    <circle cx="96" cy="60" r="9"/>
    <circle cx="78" cy="91.2" r="9"/>
    <circle cx="42" cy="91.2" r="9"/>
    <circle cx="24" cy="60" r="9"/>
    <circle cx="42" cy="28.8" r="9"/>
    <circle cx="78" cy="28.8" r="9"/>
  </g>
  <circle cx="60" cy="60" r="16" fill="#fff"/>
  <circle cx="60" cy="60" r="7.5" fill="#6a5cf5"/>
</svg>
