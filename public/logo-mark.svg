<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paulo Kasmirscki">
  <defs>
    <!-- userSpaceOnUse: o degradê pinta também as ligações retas (horizontais) -->
    <linearGradient id="pk" gradientUnits="userSpaceOnUse" x1="15" y1="20" x2="105" y2="100">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- ligações -->
  <g stroke="url(#pk)" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="60" x2="100" y2="60"/>
    <line x1="60" y1="60" x2="80" y2="94.6"/>
    <line x1="60" y1="60" x2="40" y2="94.6"/>
    <line x1="60" y1="60" x2="20" y2="60"/>
    <line x1="60" y1="60" x2="40" y2="25.4"/>
    <line x1="60" y1="60" x2="80" y2="25.4"/>
  </g>
  <!-- nós -->
  <g fill="url(#pk)">
    <circle cx="100" cy="60" r="9"/>
    <circle cx="80" cy="94.6" r="9"/>
    <circle cx="40" cy="94.6" r="9"/>
    <circle cx="20" cy="60" r="9"/>
    <circle cx="40" cy="25.4" r="9"/>
    <circle cx="80" cy="25.4" r="9"/>
  </g>
  <!-- centro -->
  <circle cx="60" cy="60" r="16" fill="#fff"/>
  <circle cx="60" cy="60" r="8" fill="url(#pk)"/>
</svg>
